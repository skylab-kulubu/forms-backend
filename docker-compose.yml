services:
  forms:
    container_name: forms
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=forms_db;Username=forms;Password=${FORMS_DB_PASSWORD:-postgres}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:5000}"
      Authentication__Issuer: "${AUTH_ISSUER:-https://e.yildizskylab.com/realms/e-skylab}"
      Authentication__Audience: "${AUTH_AUDIENCE:-forms}"
      Authentication__ClockSkewSeconds: "${AUTH_CLOCK_SKEW_SECONDS:-30}"
      Authentication__MetadataTimeoutSeconds: "${AUTH_METADATA_TIMEOUT_SECONDS:-5}"
      ACCOUNT_ACCESS_GATE_MODE: "${ACCOUNT_ACCESS_GATE_MODE:-off}"
      ACCOUNT_ACCESS_REDIS_ENDPOINT: "${ACCOUNT_ACCESS_REDIS_ENDPOINT:-}"
      ACCOUNT_ACCESS_REDIS_USERNAME: "${ACCOUNT_ACCESS_REDIS_USERNAME:-}"
      ACCOUNT_ACCESS_REDIS_PASSWORD: "${ACCOUNT_ACCESS_REDIS_PASSWORD:-}"
      ACCOUNT_ACCESS_REDIS_DATABASE: "${ACCOUNT_ACCESS_REDIS_DATABASE:-}"
      ACCOUNT_ACCESS_REDIS_TLS: "${ACCOUNT_ACCESS_REDIS_TLS:-false}"
      ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT_MS: "${ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT_MS:-200}"
      ACCOUNT_ACCESS_GATE_RETRY_AFTER_SECONDS: "${ACCOUNT_ACCESS_GATE_RETRY_AFTER_SECONDS:-1}"
      Redis__ConnectionString: "redis:6379,defaultDatabase=1"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      Services__Users__BaseUrl: "${CORE_URL:-http://core:8080}"
      Services__SkyMail__BaseUrl: "${SKYMAIL_URL:-http://skymail:3000/v1/}"
      Keycloak__TokenUrl: "${KEYCLOAK_TOKEN_URL}"
      Keycloak__ClientId: "${KEYCLOAK_CLIENT_ID}"
      Keycloak__ClientSecret: "${KEYCLOAK_CLIENT_SECRET}"
      FormMail__FormCopyTemplateId: "${FORMMAIL_FORM_COPY_TEMPLATE_ID}"
      FormMail__StatusChangedTemplateId: "${FORMMAIL_STATUS_CHANGED_TEMPLATE_ID}"
      FormMail__PendingReminderTemplateId: "${FORMMAIL_PENDING_REMINDER_TEMPLATE_ID}"
    restart: unless-stopped
    networks:
      - skylab

networks:
  skylab:
    external: true
